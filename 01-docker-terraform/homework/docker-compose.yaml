services:
  pgdatabase:
    image: postgres:18
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=data_homework
    volumes:
      - "./homework_postgres_data:/var/lib/postgresql"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d data_homework"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=root
    volumes:
      - "pgadmin_data:/var/lib/pgadmin"
    ports:
      - "8085:80"

  ingest:
    build: .
    profiles: ["ingest"]
    entrypoint: ["python", "ingest_hw.py", "--pg-host=pgdatabase"]
    volumes:
      - "./data:/app/data"
    depends_on:
      pgdatabase:
        condition: service_healthy

volumes:
  pgadmin_data:
